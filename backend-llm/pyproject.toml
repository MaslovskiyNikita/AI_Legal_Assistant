[project]
name = "backend-llm"
version = "0.1.0"
description = ""
authors = [
    {name = "stanislav", email = "s.markovtsev@gmail.com"}
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn==0.27.0",
    "python-multipart>=0.0.6",
    "python-docx>=1.1.0",
    "httpx>=0.26.0",
    "pydantic>=2.6.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "getenv>=0.2.0",
    "dotenv>=0.9.9",
    "aiofiles>=25.1.0",
    "langchain (>=1.2.12,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-huggingface (>=1.2.1,<2.0.0)",
