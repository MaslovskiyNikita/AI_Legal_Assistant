services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8023:8023"
    depends_on:
      - db-backend
    env_file:
      - backend/.env
    volumes:
      - ./backend:/app
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FORCE_COLOR=1

  db-backend:
    image: pgvector/pgvector:pg15
    restart: always
    command: -p 6432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superpassword
      POSTGRES_DB: hackathon_db
    ports:
      - "6432:6432"
    env_file:
      - ./backend/.env
