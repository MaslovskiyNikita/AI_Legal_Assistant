services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8023:8023"
    depends_on:
      - db-backend
    env_file:            
      - backend/.env              
    volumes:
      - ./backend:/app


  db-backend:
    image: postgres:15-alpine
    restart: always
    command: -p 6432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superpassword
      POSTGRES_DB: hackathon_db
    ports:
      - "6432:6432"
    env_file:            
      - ./backend/.env     
    