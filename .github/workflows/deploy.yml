name: Deploy to Production

on:
  push:
    branches:
      - feature/deploy

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Set Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          AUTHOR="${{ github.actor }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_DEPLOYMENT_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_ADMIN_ID }}" \
          -d parse_mode="HTML" \
          -d disable_web_page_preview="true" \
          -d text="⏳ <b>AI Legal Assistant: Деплой запущен</b>%0A%0A👤 <b>Автор:</b> $AUTHOR%0A🌿 <b>Ветка:</b> <code>$BRANCH</code>%0A🔢 <b>Хэш:</b> <a href='$COMMIT_URL'>$SHA_SHORT</a>%0A📝 <b>Коммит:</b> <i>$COMMIT_MSG</i>%0A%0A⚙️ <a href='$RUN_URL'>Логи GitHub Actions</a>"

      - name: Git Pull and Reset
        run: |
          cd /home/stanislav/hacaton/AI_Legal_Assistant
          git fetch
          git checkout feature/deploy
          git reset --hard origin/feature/deploy

      - name: Create .env file
        run: |
          cd /home/stanislav/hacaton/AI_Legal_Assistant/backend
          echo "# Generated by GitHub Actions" > .env
          echo "EMBEDDINGS_MODEL=intfloat/multilingual-e5-large" >> .env
          echo "GEMINI_MODEL=gemini-2.5-flash" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "GEMINI_BASE_URL=https://still-limit-741c.s-markovtsev.workers.dev" >> .env
          echo "GEMINI_TIMEOUT_SECONDS=30" >> .env
          echo "TOP_K=7" >> .env
          echo "HF=${{ secrets.HF_TOKEN }}" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "POSTGRES_HOST=db-backend" >> .env
          echo "POSTGRES_PORT=6432" >> .env
          echo "POSTGRES_DB=hackathon_db" >> .env

      - name: Set Build Start Time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Restart Docker
        run: |
          cd /home/stanislav/hacaton/AI_Legal_Assistant
          docker compose up -d --build --force-recreate
          docker image prune -f

      - name: Notify Success
        if: success()
        run: |
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - START_TIME))
          BUILD_DURATION=$((END_TIME - BUILD_START_TIME))
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_DEPLOYMENT_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_ADMIN_ID }}" \
          -d parse_mode="HTML" \
          -d text="✅ <b>AI Legal Assistant: Обновлен успешно</b>%0A%0A🛠 <b>Сборка:</b> ${BUILD_DURATION} сек.%0A🚀 <b>Всего:</b> ${TOTAL_DURATION} сек.%0A%0A📱 <a href='http://t.me/AIAssistantLegalBot/app'>Открыть Mini App</a>"

      - name: Notify Failure
        if: failure()
        run: |
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - START_TIME))
          cd /home/stanislav/hacaton/AI_Legal_Assistant
          LOGS=$(docker compose logs --tail=15)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_DEPLOYMENT_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TG_ADMIN_ID }}" \
          -d parse_mode="HTML" \
          -d text="❌ <b>AI Legal Assistant: Ошибка деплоя</b>%0A%0A⏱ <b>Прошло:</b> ${TOTAL_DURATION} сек.%0A⚠️ <b>Последние логи:</b>%0A<code>$LOGS</code>%0A%0A⚙️ <a href='$RUN_URL'>Подробности в Actions</a>"
