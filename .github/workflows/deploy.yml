name: Deploy to Production

on:
  push:
    branches:
      - feature/deploy

jobs:
  deploy:
    runs-on: self-hosted 
    steps:
      - name: Git Pull and Restart
        run: |
          cd /home/stanislav/hacaton/AI_Legal_Assistant

          git fetch
          git checkout feature/deploy
          git reset --hard origin/feature/deploy
          
          docker compose up -d --build
